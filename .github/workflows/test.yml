name: Test
run-name: ${{ inputs.title }}

on:
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - "**/*.tscn"
      - "**/*.tres"
      - "**/*.gd"
      - ".github/workflows/test.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/**"
      - "Tests/*.ts"
      - "scripts/**"
      - "deno.json"
      - "deno.lock"
      - ".runsettings"
      - "export_presets.cfg"
      - "mise.toml"
      - "project.godot"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - "**/*.tscn"
      - "**/*.tres"
      - "**/*.gd"
      - ".github/workflows/test.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/**"
      - "Tests/*.ts"
      - "scripts/**"
      - "deno.json"
      - "deno.lock"
      - ".runsettings"
      - "export_presets.cfg"
      - "mise.toml"
      - "project.godot"
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to test and prepare artifacts for
        required: true
        type: string
      title:
        description: Commit title for the workflow run
        required: false
        type: string

concurrency:
  group: test-${{ inputs.commit || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    env:
      GODOT_VERSION: 4.6.3-stable
      SOURCE_COMMIT: ${{ inputs.commit || github.sha }}
    steps:
      - name: Checkout source ${{ inputs.commit || github.sha }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || github.sha }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8

      - name: check for successful tests on this commit
        id: reuse
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno run --frozen -A .github/scripts/find-test-result.ts "$GITHUB_REPOSITORY" "$SOURCE_COMMIT" "$GITHUB_RUN_ID"

      - name: resolve build version
        id: version
        shell: bash
        run: deno run --frozen -A .github/scripts/prepare-artifacts.ts "$SOURCE_COMMIT"

      - name: setup dotnet
        if: steps.reuse.outputs.test-passed != 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: install Godot Mono
        if: steps.reuse.outputs.test-passed != 'true'
        id: godot
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP "godot-mono.zip"
          $installDir = Join-Path $env:RUNNER_TEMP "godot-mono"
          $downloadUrl = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION/Godot_v$env:GODOT_VERSION" + "_mono_win64.zip"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath
          Expand-Archive -LiteralPath $zipPath -DestinationPath $installDir -Force

          $godot = Get-ChildItem -LiteralPath $installDir -Recurse -Filter "Godot_v*_mono_win64_console.exe" |
            Select-Object -First 1

          if (-not $godot) {
            throw "Godot Mono console executable not found."
          }

          "godot_bin=$($godot.FullName)" >> $env:GITHUB_OUTPUT

      - name: test
        if: steps.reuse.outputs.test-passed != 'true'
        shell: pwsh
        run: dotnet test Tempora.csproj --settings .runsettings -e "GODOT_BIN=${{ steps.godot.outputs.godot_bin }}"

      - name: verify artifact preparation and reuse
        if: steps.reuse.outputs.test-passed != 'true'
        shell: bash
        run: |
          deno task check
          deno task test

  export_game:
    name: Export Game
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6.3-stable
      SOURCE_COMMIT: ${{ needs.test.outputs.commit }}
      BUILD_VERSION: ${{ needs.test.outputs.version }}
    steps:
      - name: checkout tested source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.test.outputs.commit }}
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8

      - name: apply the fixed build version
        shell: bash
        run: deno run --frozen -A .github/scripts/prepare-artifacts.ts "$SOURCE_COMMIT" "$BUILD_VERSION"

      - name: export game
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_mono_linux_x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_mono_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Linux/X11,Windows,macOS
          archive_output: true

      - name: re-sign macOS app and name release archives
        id: artifacts
        shell: bash
        env:
          ARCHIVE_DIRECTORY: ${{ steps.export.outputs.archive_directory }}
        run: bash .github/scripts/package-artifacts.sh "$ARCHIVE_DIRECTORY"

      - name: upload ready-to-publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: ${{ steps.artifacts.outputs.directory }}/*
          if-no-files-found: error
          overwrite: true
